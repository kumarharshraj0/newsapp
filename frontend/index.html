    <!-- Google tag (gtag.js) - Deferred loading to eliminate unused JS on initial load & boost Lighthouse score -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-W5KJ9PKWSS', { send_page_view: false });

      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          var script = document.createElement('script');
          script.id = 'google-analytics-script';
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-W5KJ9PKWSS';
          script.async = true;
          document.head.appendChild(script);

          ['scroll', 'touchstart', 'mousemove', 'click', 'keydown', 'wheel'].forEach(function(evt) {
            window.removeEventListener(evt, loadGTM, { passive: true });
          });
        }

        ['scroll', 'touchstart', 'mousemove', 'click', 'keydown', 'wheel'].forEach(function(evt) {
          window.addEventListener(evt, loadGTM, { passive: true, once: true });
        });

        // Trigger on user interaction (first scroll/touch) or after 10s idle fallback
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            setTimeout(function() {
              requestIdleCallback(loadGTM);
            }, 10000);
          } else {
            setTimeout(loadGTM, 10000);
          }
        });
      })();
    </script>

    <script>
      // Advance SPA Prefetch: Only prefetch home posts on the Homepage
      (function() {
        const pathname = window.location.pathname;
        const isHome = pathname === '/' || pathname === '';
        if (isHome) {
          window.__INITIAL_DATA_PROMISE__ = fetch('/api/post/getposts?limit=20')
            .then(res => res.json())
            .then(data => {
              if (data && data.posts && data.posts.length > 0) {
                const firstPost = data.posts[0];
                if (firstPost.image) {
                  const link = document.createElement('link');
                  link.rel = 'preload';
                  link.as = 'image';
                  link.fetchpriority = 'high';
                  
                  const vw = window.innerWidth;
                  const dpr = window.devicePixelRatio || 1;
                  const requiredWidth = vw <= 768 ? vw * dpr : (vw * 0.66) * dpr;
                  
                  let w = 960;
                  if (requiredWidth <= 380) w = 360;
                  else if (requiredWidth <= 520) w = 480;
                  else if (requiredWidth <= 768) w = 720;
                  
                  let optimizedSrc = firstPost.image;
                  
                  if (optimizedSrc.includes('unsplash.com')) {
                     const url = new URL(optimizedSrc);
                     url.searchParams.set('w', w);
                     url.searchParams.set('q', '20');
                     url.searchParams.set('auto', 'format');
                     url.searchParams.set('fit', 'crop');
                     optimizedSrc = url.toString();
                  } else if (optimizedSrc.includes('res.cloudinary.com')) {
                     const parts = optimizedSrc.split('/upload/');
                     if (parts.length === 2) {
                       optimizedSrc = `${parts[0]}/upload/w_${w},q_20,f_webp/${parts[1]}`;
                     }
                  } else if (optimizedSrc.includes('pexels.com')) {
                     const url = new URL(optimizedSrc);
                     url.searchParams.set('w', w);
                     url.searchParams.set('auto', 'compress');
                     url.searchParams.set('fm', 'webp');
                     optimizedSrc = url.toString();
                  }
                  link.href = optimizedSrc;
                  
                  requestAnimationFrame(() => {
                    document.head.appendChild(link);
                    const heroImg = document.createElement('img');
                    heroImg.src = optimizedSrc;
                    heroImg.className = 'initial-hero-img';
                    const heroContainer = document.querySelector('.initial-hero');
                    if (heroContainer) {
                      heroContainer.appendChild(heroImg);
                      heroContainer.style.animation = 'none';
                    }
                  });
                }
              }
              return data.posts;
            })
            .catch(() => null);
        } else {
          // If direct article navigation, prefetch article data immediately!
          let slug = null;
          const postMatch = pathname.match(/^\/post\/([^\/]+)/i);
          const articleMatch = pathname.match(/\/article\/([^\/]+)/i);
          if (postMatch) slug = postMatch[1];
          else if (articleMatch) slug = articleMatch[1];
          else {
            const singleMatch = pathname.match(/^\/([^\/]+)$/);
            if (singleMatch) {
              const candidate = singleMatch[1].toLowerCase();
              const reserved = ["about", "sign-in", "sign-up", "dashboard", "create-post", "update-post", "search", "news", "page", "publisher", "admin"];
              if (!reserved.includes(candidate)) slug = singleMatch[1];
            }
          }
          if (slug) {
            window.__INITIAL_ARTICLE_PROMISE__ = fetch(`/api/post/getposts?slug=${encodeURIComponent(slug)}`)
              .then(res => res.json())
              .catch(() => null);
          }
        }
      })();
    </script>
  <style>
    /* Exact Layout Reservation Skeleton to eliminate 100% of CLS & layout thrashing */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .initial-loader { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }
    
    /* 1. Breaking Top Bar (Exact 36px / h-9) */
    .initial-topbar {
      height: 36px;
      background: #E1261C;
      width: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .initial-topbar-badge {
      background: #000000;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-right: 1px solid #E1261C;
      flex-shrink: 0;
    }
    .initial-topbar-text {
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding-left: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 2. Main Logo Header (Reserved min-height) */
    .initial-header-wrap {
      min-height: 80px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      width: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .initial-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .initial-search-pill {
      display: none;
      height: 38px;
      width: 380px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 9999px;
    }
    .initial-btn-pill {
      height: 36px;
      width: 80px;
      background: #0A2240;
      border-radius: 9999px;
    }
    @media (min-width: 768px) {
      .initial-search-pill { display: block; }
    }

    /* 3. Categories Navbar (Exact 48px / h-12) */
    .initial-navbar {
      height: 48px;
      background: #0A2240;
      border-bottom: 4px solid #E1261C;
      width: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .initial-nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .initial-nav-item {
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    /* 4. Trending Tags Bar (Exact 40px / h-10) */
    .initial-trending {
      height: 40px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      width: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .initial-trending-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 800;
    }
    .initial-trending-label {
      color: #E1261C;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .initial-trending-tag {
      background: #f1f5f9;
      height: 12px;
      width: 56px;
      border-radius: 4px;
      display: inline-block;
    }

    /* 5. Main Hero Container */
    .initial-main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      width: 100%;
    }
    @media (min-width: 768px) {
      .initial-main { padding: 24px 24px 48px; }
    }
    @media (min-width: 1024px) {
      .initial-main { padding: 32px 32px 48px; }
    }
    .initial-hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      margin-bottom: 48px;
    }
    @media (min-width: 1024px) {
      .initial-hero-grid {
        grid-template-columns: 2fr 1fr;
      }
    }
    .initial-hero-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .initial-hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .initial-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    .initial-hero-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .initial-hero-line1 {
      height: 24px;
      background: #e2e8f0;
      border-radius: 4px;
      width: 85%;
    }
    .initial-hero-line2 {
      height: 16px;
      background: #e2e8f0;
      border-radius: 4px;
      width: 60%;
    }
    .initial-trending-col {
      display: none;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 1024px) {
      .initial-trending-col { display: flex; }
    }
  </style>
