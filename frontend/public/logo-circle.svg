<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2240" />
      <stop offset="100%" stop-color="#051324" />
    </linearGradient>
    <linearGradient id="pulseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1261C" />
      <stop offset="100%" stop-color="#FF5247" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#circleGrad)" stroke="#E1261C" stroke-width="5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Pulse Wave Icon -->
  <g transform="translate(42, 38)">
    <path d="M10,65 L32,22 L55,68 L78,35 L100,72" fill="none" stroke="url(#pulseRed)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="32" cy="22" r="5.5" fill="#E1261C" />
    <circle cx="78" cy="35" r="5" fill="#FFFFFF" />
  </g>

  <!-- Brand Text -->
  <text x="100" y="142" font-family="'Inter', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    NEW <tspan fill="#E1261C">PULSE</tspan>
  </text>
  
  <text x="100" y="160" font-family="'Inter', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
    NEWS NETWORK
  </text>
</svg>
